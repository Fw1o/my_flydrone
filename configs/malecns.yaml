# Real MaleCNS v1.0 brain. Build it first:
#   flydrones download malecns && flydrones build-brain --out data/malecns_brain.npz
#   flydrones calibrate --brain data/malecns_brain.npz --out readout_malecns.json
#
# `malecns_brain_v2.npz` is the same matrix with the missing left/right labels filled
# in from the wiring (photoreceptor / haltere populations ship without somaSide, which
# used to leave the brightness and haltere input groups empty).
brain:
  source: data/malecns_brain_v2.npz
  backend: auto            # torch 可用就用 GPU(全量约 1.0x 实时),否则退回 CPU(约 0.24x)
  lif:
    dt: 0.5
    noise_mv: 0.0
  # bias 的 key 可以是 inputs/outputs 里的组名,也可以直接是细胞类型(DNg02_a 等);
  # 类型匹配不到任何神经元时会给出警告。
  bias:                   # tonic flight drive; re-tune with `flydrones inspect` if DNg02 is silent or saturated
    DNg02_a: 8.0
    DNg02_c: 8.0
    DNg02_d: 8.0
    DNg02_f: 8.0
    DNg02_g: 8.0
  record_neurons: 600
inputs:
  # side 约束依赖构建时的侧向补全(见 brain/connectome.py: infer_missing_sides)。
  # 若用手工构建、side 为空的 npz,HAL/R16 会匹配到 0 个并在启动时告警。
  HAL_L: {types: ["(?i)haltere"], side: L, feature: yaw_neg, max_hz: 50}
  HAL_R: {types: ["(?i)haltere"], side: R, feature: yaw_pos, max_hz: 50}
decoder:
  readout_file: readout_malecns.json
  settle_s: 2.0